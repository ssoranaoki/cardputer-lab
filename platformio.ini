; Cardputer-Adv 公式ドキュメントの PlatformIO 設定例をもとにする
; https://docs.m5stack.com/en/core/Cardputer-Adv （2026-10-19 確認）
;
; デモごとに src/<名前>/ にプログラムを分け、[env:<名前>] で選ぶ。
;   VSCode: 下のステータスバーで env（hello / demo1 …）を選び、Upload → 終わってからターミナルで pio device monitor
;           （VSCode のシリアルモニター画面の「監視の開始／終了」は使わない。終了するとボードが書き込みモードで起き直す）
;   CLI:    pio run -e demo1 -t upload ／ pio device monitor（書き込みとモニターは別々に）

[platformio]
default_envs = edit1

; どのデモにも共通の設定
[env]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
; 書き込みツール esptool を新しくする（2026-10-24）。
; espressif32@6.7.0 に付いてくる esptool 4.5.1 には、動いているプログラムが USB シリアルに書き続けていると
; 「Stub running → Changing baud rate → No serial data received」で書き込みが失敗する既知の問題がある
; （espressif/esptool #868・#1070。v4.7.dev2 で修正）。
; 2.40900.0 は esptool 4.9.0（espressif32@6.12.0 が使っている版）。部品を入れる postinstall は cryptography が既にあると何もしないので、
; 初回に intelhex と PyYAML を手で入れる（2026-10-24）:
;   & "$env:USERPROFILE\.platformio\penv\Scripts\python.exe" -m pip install --no-compile -t "$env:USERPROFILE\.platformio\packages\tool-esptoolpy\_contrib" intelhex PyYAML
; それでも失敗したら、手動の書き込みモード（電源 OFF → G0 を押したまま USB を差す → 離す）で書く
platform_packages =
    platformio/tool-esptoolpy@2.40900.0
; 公式例は 1500000。2026-10-23 の失敗のときに下げた（速さは原因ではなかった）
upload_speed = 921600
monitor_speed = 115200
; モニターを開く・閉じるときに RTS/DTR の線を動かさない（2026-10-24）。
; ESP32-S3 の USB Serial/JTAG は RTS/DTR で「RTS0・DTR1＝次は書き込みモードで起動」「RTS1・DTR0＝リセット」になる
; （ESP32-S3 技術リファレンスマニュアル 33.3.2 表 33.3-2）。VSCode のシリアルモニター画面で監視を終了すると書き込みモードで起き直した
; （2026-10-24 確認）。ターミナルの pio device monitor ＋この2行なら Ctrl+C で止めても動き続けた
monitor_dtr = 0
monitor_rts = 0
build_flags =
    -DESP32S3
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    ; 版を固定する（2026-10-29）。固定しないと GitHub の main の最新を取ってくる。shell2 の fn＋;/fn＋. の ↑↓ は
    ; タグ 1.1.1 には無く main（このコミット）にある
    M5Cardputer=https://github.com/m5stack/M5Cardputer#bf64d3178ab43928fa02365fbe3937cec99716ad

; 単位0: 書き込みの確認（画面・キー・シリアル）
[env:hello]
build_src_filter = +<hello/>

; デモ1: UNO 流（millis() で2つの仕事を順番に回す）
[env:demo1]
build_src_filter = +<demo1/>

; デモ2: OS 流（FreeRTOS のタスク2つに任せる）
[env:demo2]
build_src_filter = +<demo2/>

; デモ3: キーで片方のタスクを止める（vTaskSuspend / vTaskResume）
[env:demo3]
build_src_filter = +<demo3/>

; デモ4: 交代の帯（コア0の見張り役が、コア1の当番を1ms ごとに記録する）
[env:demo4]
build_src_filter = +<demo4/>

; 順番係をつくる 1段目（協力型）: 自作の係が仕事A・B を交代で呼ぶ（docs/presentation-junban.md）
[env:junban1]
build_src_filter = +<junban1/>

; 小さなシェルをつくる（docs/presentation-shell.md）: キーボードの命令で仕事を作る・止める・一覧する
[env:shell1]
build_src_filter = +<shell1/>

; シェルを広げる v0.5（docs/presentation-shell2.md）: 補完・履歴・ファイル（LittleFS）。shell1（v0.4）は教科書 第8章のためそのまま残す
[env:shell2]
build_src_filter = +<shell2/>

; ファイルを書く v0.6（docs/presentation-shell3.md）: echo > / >>・rm・mkdir・cd・pwd。shell2（v0.5）は教科書 第9章のためそのまま残す
[env:shell3]
build_src_filter = +<shell3/>

; メモ帳 v0.7: edit <ファイル>。count・ball と上の段の窓はなくした。shell3（v0.6）は教科書 第10章のためそのまま残す
[env:edit1]
build_src_filter = +<edit1/>
